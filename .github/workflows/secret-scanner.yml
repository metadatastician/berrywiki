# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# `secrets: inherit` is REQUIRED — without it the gitleaks action's inner
# secrets.GITHUB_TOKEN is empty and the scan silently degrades.
#
# The pin below is to `e13e2ea3`, the newest commit that modifies
# `.github/workflows/secret-scanner-reusable.yml` (2026-09-19, "fix(ci): pin
# third-party actions to full commit SHAs"). The bytes at that commit are
# identical to `main` as measured 2026-09-25. Bumped from `c51fb976`
# (2026-09-02) for three changes that matter to a caller:
#
#   * The estate baseline is now fetched at `${{ job.workflow_sha }}` instead
#     of the moving `main`. A pin that stages its config from a branch is not
#     really pinned: what the scan enforces could change under it without the
#     pin moving.
#   * A second, gating full-history pass was added beside the working-tree
#     pass. They see different populations (committed-then-deleted blobs vs
#     never-committed files), so a finding in either now fails the check.
#   * The callee still requires only `contents: read` from a caller, which is
#     all this file grants, and still requires `secrets: inherit`, which this
#     file passes. The pre-#500 guidance asking callers for
#     `pull-requests: write` + `actions: read` was never in force here.
#
# A reusable-workflow pin is NOT Dependabot-managed — the ref is a commit that
# carries no tag, so there is no version for Dependabot to compare against. It
# is hand-bumped under the rule in docs/development/ci.adoc.
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secret-scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@e13e2ea3dbbc9c7815e39c3749b4480514f555a6
    secrets: inherit
