# SPDX-License-Identifier: MPL-2.0
# Calls the immutable estate secret scanner at the canonical standards owner.
# The pinned scanner uses the caller's contents-read token and no caller secrets.
{
  name: "Secret Scanner",
  on: {
    pull_request: null,
    push: {
      branches: [
        "main",
        "master",
      ],
    },
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.ref }}",
    cancel-in-progress: true,
  },
  permissions: {
    contents: "read",
  },
  jobs: {
    scan: {
      uses: "metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1",
    },
  },
}
