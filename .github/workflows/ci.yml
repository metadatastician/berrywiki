name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions (spec: least privilege).
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to a SHA, dtolnay/rust-toolchain cannot infer the toolchain
      # from the ref, so `toolchain:` must be explicit.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # NOTE: rustfmt/clippy cannot run on the dev host (distro Rust, no rustup),
      # so this is the first place the code is normalised. Before the first push
      # to a remote, run `cargo fmt --all` on a rustfmt-capable machine — the
      # initial run may otherwise fail on formatting. clippy runs rustc lints
      # too, so it also enforces the warning-free build for workspace crates.
      - name: rustfmt (check)
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    name: test (rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 1.89.0 enforces the declared MSRV (workspace rust-version); stable
        # catches issues the pinned toolchain would miss.
        rust: ["1.89.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build (locked)
        run: cargo build --workspace --locked
      # The full suite includes the no-<script> SSR assertions and the git
      # conflict / no-data-loss harness, so `cargo test` IS the security and
      # safety gate.
      - name: test (locked)
        run: cargo test --workspace --locked
      # docs/proofs/invariants.adoc names the test that witnesses each
      # INV-n. This gate fails when a named test no longer exists or is not
      # registered, so the ledger cannot rot silently. The list is written
      # to a file, never piped, so the exit status is cargo's own.
      - name: invariants ledger (witnesses registered)
        run: |
          cargo test --workspace --locked -- --list > "$RUNNER_TEMP/test-list.txt"
          scripts/check-invariants-ledger.sh "$RUNNER_TEMP/test-list.txt"
  shell:
    name: shell script gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No Rust here on purpose. Until D-16 deleted the launcher pair this
      # gate was carried by scripts/check-launcher.sh, which ran bash -n and
      # shellcheck over every shell script as a side effect of smoke-testing
      # the launcher. The launcher is gone; the shellcheck half is kept on
      # its own rather than deleted along with it.
      #
      # Fail-closed by design: the old script could be told to skip
      # shellcheck with an environment variable, so a runner without it
      # produced a warning and a green job. Here a missing shellcheck fails
      # the step, and an empty scripts/ leaves the glob unexpanded and also
      # fails, rather than passing vacuously.
      - name: bash -n + shellcheck
        run: |
          set -eu
          shellcheck --version
          for s in scripts/*.sh; do bash -n "$s"; done
          shellcheck -S style scripts/*.sh
  docs:
    name: AsciiDoc render gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned: the gate's verdict is "asciidoctor wrote nothing to stderr", so
      # an unpinned upgrade that adds one diagnostic would redden files the
      # host renders clean. A version bump here is a deliberate, reviewable act.
      - name: Install asciidoctor
        run: sudo gem install --no-document asciidoctor -v 2.0.26
      # asciidoctor's default failure level is FATAL, so a malformed table
      # emits ERROR on stderr and still exits 0. This gate reads stderr, not
      # the exit code, and plants a known-bad fixture first so a green run
      # means the gate was able to fail and did not.
      - name: AsciiDoc render gate
        run: scripts/check-adoc.sh
