name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions (spec: least privilege).
permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned to a SHA, dtolnay/rust-toolchain cannot infer the toolchain
      # from the ref, so `toolchain:` must be explicit.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # NOTE: rustfmt/clippy cannot run on the dev host (distro Rust, no rustup),
      # so this is the first place the code is normalised. Before the first push
      # to a remote, run `cargo fmt --all` on a rustfmt-capable machine — the
      # initial run may otherwise fail on formatting. clippy runs rustc lints
      # too, so it also enforces the warning-free build for workspace crates.
      - name: rustfmt (check)
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    name: test (rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 1.85.0 enforces the declared MSRV (workspace rust-version); stable
        # catches issues the pinned toolchain would miss.
        rust: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: build (locked)
        run: cargo build --workspace --locked
      # The full suite includes the no-<script> SSR assertions and the git
      # conflict / no-data-loss harness, so `cargo test` IS the security and
      # safety gate.
      - name: test (locked)
        run: cargo test --workspace --locked
