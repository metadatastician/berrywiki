{
  name: "Formatting Validation Gate",
  description: "Enforces the estate document-format policy: .adoc for docs, .md for wiki content, .txt for licence texts, fixed names where GitHub or convention dictates.",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run Formatting Check",
        shell: "bash",
        run: "# Estate document-format policy\n#\n#   .adoc   documentation — the default for everything narrative\n#   .md     wiki content ONLY, plus a TRANSITIONAL allowance for the\n#           files GitHub renders specially; those are migrating to\n#           metadatastician/berrywiki format\n#   .txt    licence texts (LICENSE, LICENSES/*)\n#   fixed   names GitHub or long convention dictates keep their form:\n#           CODEOWNERS, MAINTAINERS, NOTICE, AUTHORS (extensionless),\n#           funding.yml, dependabot.yml, *.yml workflows, dotfiles\n#\n# This gate used to only ever warn, while required-files-check HARD\n# FAILED a repo for lacking GOVERNANCE.md — so a repo following the\n# .adoc policy was failed by one gate for obeying the other. That\n# contradiction is gone: required-files-check now accepts either form,\n# and this gate is where the preference is expressed.\n#\n# Split by confidence: formats that are never legal fail; the .md\n# files awaiting the berrywiki migration warn.\nset -uo pipefail\nfail=0\n\n# Files whose .md form is GitHub-mandated or conventional. Transitional\n# — when berrywiki lands these move, and this list shrinks.\nGH_MANDATED='^(README|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT|CHANGELOG|SUPPORT|SUPPORT_POLICY)\\.md$'\nWIKI_DIRS='^(wiki|docs/wiki|docs/wikis)/'\n\necho \"Checking document formats...\"\n\n# --- hard: a documentation format that is never policy-legal --------\nillegal=$(git ls-files | grep -E '\\.(rst|textile|org|pod|wiki)$' || true)\nif [ -n \"$illegal\" ]; then\n  echo \"::error::Documentation in a format the estate does not use:\"\n  printf '%s\\n' \"$illegal\"\n  echo \"::error::Convert to .adoc (or .md if it is wiki content).\"\n  fail=1\nfi\n\n# --- hard: licence texts must be .txt -------------------------------\nbadlic=$(git ls-files 'LICENSES/*' | grep -vE '\\.txt$' || true)\nif [ -n \"$badlic\" ]; then\n  echo \"::error::Licence texts must be .txt:\"\n  printf '%s\\n' \"$badlic\"\n  fail=1\nfi\n\n# --- hard: wiki content must be .md ---------------------------------\nbadwiki=$(git ls-files | grep -E \"$WIKI_DIRS\" | grep -vE '\\.md$' | grep -vE '/(_Sidebar|_Footer|\\.gitkeep)$' || true)\nif [ -n \"$badwiki\" ]; then\n  echo \"::error::Wiki content must be .md (wikis are the one .md home):\"\n  printf '%s\\n' \"$badwiki\"\n  fail=1\nfi\n\n# --- advisory: .md documents awaiting the berrywiki migration -------\nstray=$(git ls-files '*.md' \\\n          | grep -vE \"$WIKI_DIRS\" \\\n          | grep -vE '^\\.github/' \\\n          | grep -vE '/(README|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT|CHANGELOG)\\.md$' \\\n          | grep -vE \"$GH_MANDATED\" || true)\nif [ -n \"$stray\" ]; then\n  count=$(printf '%s\\n' \"$stray\" | wc -l)\n  echo \"::warning::$count .md document(s) outside wiki and outside the\"\n  echo \"::warning::GitHub-mandated set. Policy is .adoc for documentation;\"\n  echo \"::warning::these are candidates for the berrywiki migration:\"\n  printf '%s\\n' \"$stray\" | head -20\n  [ \"$count\" -gt 20 ] && echo \"  … and $((count - 20)) more\"\nfi\n\nif [ \"$fail\" -eq 1 ]; then\n  echo \"::error::Formatting gate failed.\"\n  exit 1\nfi\necho \"Document formatting is policy-conformant.\"\n",
      },
    ],
  },
}
