{
  name: "Zig Hexadeca Check",
  description: "Checks that Zig FFI implementations adhere to the unified-hexadeca-api and are pure.",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run Zig Hexadeca Check",
        shell: "bash",
        run: "echo \"Validating Zig Hexadeca API...\"\nif find . -name \"*.zig\" | grep -q .; then\n  # Ensure it doesn't use standard library io or std.fs directly for FFI\n  if git grep -E 'std\\.fs|std\\.io' -- '*.zig'; then\n    echo \"::error::Zig FFI modules contain prohibited side-effects (std.fs/std.io). Must use unified-hexadeca-api.\"\n    exit 1\n  fi\n  echo \"Zig Hexadeca API check passed.\"\nelse\n  echo \"No Zig files found. Skipping check.\"\nfi\n",
      },
    ],
  },
}
