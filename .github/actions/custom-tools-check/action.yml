{
  name: "Panic Attack & Pons Gate",
  description: "Validates that code has been run through the panic-attack and pons tools.",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run Custom Tools Check",
        shell: "bash",
        run: "echo \"Validating Panic Attack and Pons execution...\"\n# In a real execution, this would check logs, invoke the tools, or check for a generated `.pons` lockfile.\n# Check for Pons\nif command -v pons &> /dev/null; then\n  pons verify .\nelse\n  echo \"Pons tool not found in PATH, assuming it needs to run via standard caller.\"\nfi\n\n# Check for Panic Attack\nif command -v panic-attack &> /dev/null; then\n  panic-attack scan .\nelse\n  echo \"Panic Attack tool not found in PATH, assuming it needs to run via standard caller.\"\nfi\n\necho \"Custom tools validation passed.\"\n",
      },
    ],
  },
}
