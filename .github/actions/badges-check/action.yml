{
  name: "Accreditations & Badges Gate",
  description: "Validates presence, standing, and non-drift of accreditations and badges (GLAMA, Greenweb, OpenSSF, RSR, etc.).",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run Badges and Accreditations Check",
        shell: "bash",
        run: "echo \"Validating Accreditations and Badges...\"\nREADME=\"README.adoc\"\n[ -f \"README.md\" ] && README=\"README.md\"\n\nif [ ! -f \"$README\" ]; then\n  echo \"::warning::No README found to check badges.\"\n  exit 0\nfi\n\n# Check for core badges\nfor badge in \"GLAMA\" \"Greenweb\" \"OpenSSF\" \"License\"; do\n  if ! grep -qi \"$badge\" \"$README\"; then\n    echo \"::warning::Missing $badge badge in $README. Check standing and display.\"\n  fi\ndone\n\n# Check Idris Inside / RSR compliance\nif [ -d \"src\" ] || ls *.ipkg 1>/dev/null 2>] || ls *.ipkg 1>/dev/null 2>&11; then\n   if ! grep -qi \"Idris Inside\" \"$README\"; then\n     echo \"::warning::Idris source detected but 'Idris Inside' badge is missing.\"\n   fi\n   if ! grep -qi \"RSR\" \"$README\"; then\n     echo \"::warning::Missing RSR-compliant badge in Idris repository.\"\n   fi\nfi\n\necho \"Badges and Accreditations validation complete.\"\n",
      },
    ],
  },
}
