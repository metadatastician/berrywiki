{
  name: "Metrics Extraction Gate",
  description: "Extracts error counts from Pons/Panic Attack and generates a Proof Status Matrix.",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run Metrics Extraction",
        shell: "bash",
        run: "echo \"Extracting Metrics...\"\n\n# 1. Pons/Panic Attack Error Count (Simulated for CI)\npons_errors=0\npanic_errors=0\n\nif [ -f \"pons.log\" ]; then pons_errors=$(grep -c \"ERROR\" pons.log || echo 0); fi\nif [ -f \"panic.log\" ]; then panic_errors=$(grep -c \"ERROR\" panic.log || echo 0); fi\n\necho \"Pons Error Count: $pons_errors\"\necho \"Panic Attack Error Count: $panic_errors\"\n\n# 2. Proof Status Matrix\necho \"--- Proof Status Matrix ---\"\nif [ -d \"src\" ] || ls *.ipkg 1>/dev/null 2>] || ls *.ipkg 1>/dev/null 2>&11; then\n   proven=$(git grep -i -c \"total\" || echo 0)\n   believeme=$(git grep -i -c \"believe_me\" || echo 0)\n   sorry=$(git grep -i -c \"sorry\" || echo 0)\n   admit=$(git grep -i -c \"admit\" || echo 0)\n   \n   if [ \"$believeme\" -gt 0 ] || [ \"$sorry\" -gt 0 ] || [ \"$admit\" -gt 0 ]; then\n     echo \"Status: NOT FULLY PROVEN\"\n     echo \"Escape Hatches Used: believe_me ($believeme), sorry ($sorry), admit ($admit)\"\n   else\n     echo \"Status: PROVEN (No escape hatches detected)\"\n   fi\nelse\n   echo \"Status: N/A (No formal proofs detected)\"\nfi\n\necho \"Metrics extraction complete.\"\n",
      },
    ],
  },
}
