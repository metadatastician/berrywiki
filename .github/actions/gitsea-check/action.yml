{
  name: "Git-Sea Analytics Gate",
  description: "Validates Git-Sea analytics are togglable and contain a disclaimer.",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run Git-Sea Analytics Check",
        shell: "bash",
        run: "echo \"Validating Git-Sea Analytics Configuration...\"\n\n# Check for Git-Sea configuration or disclaimer\nif [ -f \".git-sea.yml\" ] || grep -q \"git-sea\" README.adoc 2>/dev/null || grep -q \"git-sea\" README.md 2>/dev/null; then\n   echo \"Git-Sea detected.\"\n   \n   # Check for disclaimer\n   if ! grep -qi \"disclaimer\" README.adoc 2>/dev/null && ! grep -qi \"disclaimer\" README.md 2>/dev/null; then\n     echo \"::warning::Git-Sea is used but no analytics disclaimer was found in the README.\"\n   fi\n   \n   # Suggest toggles\n   echo \"Ensure Git-Sea analytics are toggled appropriately (e.g. via environment variables) so internal details are not exposed.\"\nelse\n   echo \"Git-Sea not heavily utilized or configured explicitly here.\"\nfi\n\necho \"Git-Sea Analytics validation complete.\"\n",
      },
    ],
  },
}
