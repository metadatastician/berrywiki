{
  name: "PRAT Testing Gate",
  description: "Validates that code receives PRAT testing.",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run PRAT Testing Check",
        shell: "bash",
        run: "echo \"Validating PRAT Testing inclusion...\"\n# Check if tests directory or test files mention PRAT/property testing\nif [ -d \"test\" ] || [ -d \"tests\" ] || grep -Ril \"prat\" . 2>/dev/null | grep -q .; then\n  echo \"PRAT testing vectors detected.\"\nelse\n  echo \"::warning::No PRAT testing detected for this codebase. Code should all receive PRAT testing.\"\n  # Not failing the build immediately, but flagging it.\nfi\n",
      },
    ],
  },
}
