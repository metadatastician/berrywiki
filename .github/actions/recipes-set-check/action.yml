{
  name: "Recipes Set Validation Gate",
  description: "Parse-checks the repository task runner (Justfile / Makefile). Fails on a recipe file that does not parse.",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run Recipes Set Check",
        shell: "bash",
        run: "# This gate used to be a stub: it printed \"Checking Justfile syntax...\"\n# with the actual command commented out, then delegated \"extensiveness\"\n# to a semantic-audit action that is itself unimplemented, then printed\n# \"Recipes Set Validation Passed.\" It could not fail, and checked nothing.\n#\n# It now does the one thing it can do honestly and cheaply: prove the\n# recipe files parse. `just --summary` parses the whole file and lists\n# targets WITHOUT executing anything, so it is safe in CI.\n#\n# Deliberately NOT checked: whether the recipe set is \"extensive\" or\n# \"justifiable\". Those are judgements, not properties, and a gate that\n# pretends to measure them is how this action became a stub in the\n# first place.\n#\n# `just --fmt --check` is also deliberately avoided: it enforces\n# formatting, not validity, and would fail repositories whose Justfiles\n# are correct but hand-formatted.\nset -uo pipefail\nfail=0\nchecked=0\n\n# --- Justfile -----------------------------------------------------\njf=\"\"\nfor c in Justfile justfile .justfile; do [ -f \"$c\" ] && { jf=\"$c\"; break; }; done\nif [ -n \"$jf\" ]; then\n  if ! command -v just >/dev/null 2>&1; then\n    echo \"Installing just (not on PATH)...\"\n    mkdir -p \"$RUNNER_TEMP/just-bin\"\n    if curl --proto '=https' --tlsv1.2 -sSf \\\n         https://just.systems/install.sh \\\n       | bash -s -- --to \"$RUNNER_TEMP/just-bin\" >/dev/null 2>&1; then\n      export PATH=\"$RUNNER_TEMP/just-bin:$PATH\"\n    fi\n  fi\n\n  if command -v just >/dev/null 2>&1; then\n    echo \"Parsing $jf with $(just --version)...\"\n    if out=$(just --summary 2>&1); then\n      echo \"  OK — $(printf '%s' \"$out\" | wc -w) recipes parsed.\"\n      checked=1\n    else\n      echo \"::error::$jf does not parse:\"\n      printf '%s\\n' \"$out\"\n      fail=1\n    fi\n  else\n    # A gate whose tool is missing must say so, not pass. Silently\n    # skipping is how a check becomes decorative.\n    echo \"::error::$jf present but 'just' is unavailable and could not be\"\n    echo \"::error::installed, so this gate verified nothing. Add a setup\"\n    echo \"::error::step (e.g. extractions/setup-just) before this gate.\"\n    fail=1\n  fi\nfi\n\n# --- Makefile -----------------------------------------------------\nmf=\"\"\nfor c in Makefile makefile GNUmakefile; do [ -f \"$c\" ] && { mf=\"$c\"; break; }; done\nif [ -n \"$mf\" ]; then\n  if command -v make >/dev/null 2>&1; then\n    echo \"Parsing $mf...\"\n    err=$(make -n -f \"$mf\" 2>&1 >/dev/null || true)\n    # Only parse-level errors count. A missing or failing target is a\n    # different complaint and not this gate's business.\n    if printf '%s' \"$err\" | grep -qE 'missing separator|unterminated|Extraneous|recipe commences before first target|multiple target patterns'; then\n      echo \"::error::$mf does not parse:\"\n      printf '%s\\n' \"$err\" | head -10\n      fail=1\n    else\n      echo \"  OK — parses.\"\n      checked=1\n    fi\n  else\n    echo \"::error::$mf present but 'make' is unavailable; gate verified nothing.\"\n    fail=1\n  fi\nfi\n\nif [ \"$fail\" -eq 1 ]; then\n  echo \"::error::Recipes set gate failed.\"\n  exit 1\nfi\nif [ \"$checked\" -eq 0 ]; then\n  echo \"No Justfile or Makefile in this repository — nothing to parse.\"\nelse\n  echo \"Recipe files parse.\"\nfi\n",
      },
    ],
  },
}
