{
  name: "Idris2 ABI Purity Gate",
  description: "Checks that Idris2 ABI interfaces are pure and formally type-checked.",
  runs: {
    using: "composite",
    steps: [
      {
        name: "Run Idris2 ABI Purity Check",
        shell: "bash",
        run: "echo \"Validating Idris2 ABI Purity...\"\nif [ -f \"abi.ipkg\" ]; then\n  # Check for forbidden side-effects in Abi.* modules\n  if git grep -E 'IO |unsafePerformIO|primIO' -- 'src/Abi*' 'src/Hypatia/ABI*'; then\n    echo \"::error::Idris2 ABI modules contain prohibited side-effects (IO/unsafe).\"\n    exit 1\n  fi\n  echo \"Idris2 ABI is pure.\"\nelse\n  echo \"No abi.ipkg found. Skipping Idris2 ABI check.\"\nfi\n",
      },
    ],
  },
}
