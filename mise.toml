# BerryWiki's only toolchain is Rust; `just` drives the recipes. Nothing else
# belongs here. Every name below resolves with `mise ls-remote`.
#
# The previous version installed Node, Python, Go, Java, Bun, Deno, three
# package managers and five formatters for a repository that uses none of
# them (debt-register item cleared 2026-09-02). Deno is banned estate-wide.

[tools]
rust = "latest"   # CI also builds on the 1.89 MSRV; see CLAUDE.md
just = "latest"   # the estate's task runner (Justfile)
