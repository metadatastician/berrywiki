[workspace]
resolver = "2"
members = [
    "crates/berrywiki-a11y",
    "crates/berrywiki-appstate",
    "crates/berrywiki-cli",
    "crates/berrywiki-core",
    "crates/berrywiki-draft",
    "crates/berrywiki-git",
    "crates/berrywiki-git-compat",
    "crates/berrywiki-github",
    "crates/berrywiki-render",
    "crates/berrywiki-serve",
    "crates/berrywiki-store",
    "crates/berrywiki-sync",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.89"
# Code is MPL-2.0; documentation is CC-BY-SA-4.0 (see LICENSE and REUSE.toml).
# Cargo's `license` field covers the published crate, i.e. the code.
license = "MPL-2.0"
repository = "https://github.com/metadatastician/berrywiki"

[profile.release]
lto = true
