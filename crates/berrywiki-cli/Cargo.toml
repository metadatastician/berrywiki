[package]
name = "berrywiki-cli"
description = "The `berrywiki` command-line tool: inspect (check), regenerate the sidebar, and serve a wiki folder with commit-on-save. Tooling, not a second UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Zero third-party dependencies: only the workspace crates. Argument parsing is
# hand-rolled to keep the tool buildable on the offline distro toolchain.
[dependencies]
berrywiki-appstate = { path = "../berrywiki-appstate" }
berrywiki-core = { path = "../berrywiki-core" }
berrywiki-store = { path = "../berrywiki-store" }
berrywiki-serve = { path = "../berrywiki-serve" }
berrywiki-github = { path = "../berrywiki-github" }
berrywiki-git = { path = "../berrywiki-git" }
berrywiki-import = { path = "../berrywiki-import" }
berrywiki-sync = { path = "../berrywiki-sync" }

[[bin]]
name = "berrywiki"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

# Test-only: the bare-remote + two-clone git sandbox the engine tests use, so
# the backup round trip runs against real git rather than a mock.
[dev-dependencies]
berrywiki-git-compat = { path = "../berrywiki-git-compat" }
